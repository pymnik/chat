<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Chat</h1>
      <p class="subtitle">Sign in with your username</p>
      <input id="username-input" type="text" placeholder="Username" autocomplete="off" required />
      <button type="submit">Enter</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- Chat screen -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span id="current-user" class="current-user"></span>
        <button id="logout-btn" title="Log out">Log out</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <h2 id="chat-title">Select a chat</h2>
      </header>
      <div id="messages" class="messages"></div>
      <form id="message-form" class="message-form hidden">
        <input id="message-input" type="text" placeholder="Type a message…" autocomplete="off" />
        <label for="file-input" class="file-btn" title="Attach a file">📎</label>
        <input id="file-input" type="file" class="file-input-hidden" />
        <div id="voice-indicator" class="voice-indicator hidden"></div>
        <label id="voice-input" type="file" class="file-btn" title="Record a voice message">🎤</label>
        <button type="submit">Send</button>
      </form>
      <div id="file_popup" class="file-popup hidden">
        <div id="file_popup_content" class="file-popup-content">
          <button id="file_popup_close" onclick="closeFilePopup()">Close</button>
          <form id="message-form-popup" class="message-form">
            <input id="message-input" type="text" placeholder="Type a message…" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="script.js"></script>
</body>
</html>
